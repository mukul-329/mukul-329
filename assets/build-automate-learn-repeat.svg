<svg
  width="100%"
  viewBox="0 0 1200 620"
  xmlns="http://www.w3.org/2000/svg"
>

  <defs>

    <!-- Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f7faff"/>
    </linearGradient>

    <!-- Card gradients -->
    <linearGradient id="blueCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef5ff"/>
      <stop offset="100%" stop-color="#e4efff"/>
    </linearGradient>

    <linearGradient id="greenCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eefaf5"/>
      <stop offset="100%" stop-color="#e1f6ec"/>
    </linearGradient>

    <linearGradient id="orangeCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff8ed"/>
      <stop offset="100%" stop-color="#fff0d7"/>
    </linearGradient>

    <linearGradient id="purpleCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f1ff"/>
      <stop offset="100%" stop-color="#ece7ff"/>
    </linearGradient>

    <!-- Glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Card shadow -->
    <filter
      id="shadow"
      x="-20%"
      y="-20%"
      width="140%"
      height="140%"
    >
      <feDropShadow
        dx="0"
        dy="5"
        stdDeviation="8"
        flood-color="#172235"
        flood-opacity="0.10"
      />
    </filter>

    <!-- Arrow -->
    <marker
      id="arrow"
      markerWidth="9"
      markerHeight="9"
      refX="7"
      refY="3"
      orient="auto"
    >
      <path
        d="M0,0 L0,6 L7,3 Z"
        fill="#8a96a8"
      />
    </marker>

  </defs>


  <!-- ===================================================== -->
  <!-- BACKGROUND -->
  <!-- ===================================================== -->

  <rect
    width="1200"
    height="620"
    rx="20"
    fill="url(#bg)"
  />


  <!-- ===================================================== -->
  <!-- SUBTLE DEVOPS INFRASTRUCTURE BACKGROUND -->
  <!-- ===================================================== -->

  <g opacity="0.10">

    <!-- Network lines -->

    <g
      fill="none"
      stroke="#1764E8"
      stroke-width="2"
      stroke-dasharray="5 8"
