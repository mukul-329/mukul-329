        CONTAINERS
      </text>

    </g>


    <!-- Git -->

    <g transform="translate(545 390)">

      <circle
        cx="35"
        cy="0"
        r="23"
        fill="#F05032"
      />

      <path
        d="M24 -10 L35 1 L46 -10
           M35 1 V12"
        fill="none"
        stroke="white"
        stroke-width="3"
        stroke-linecap="round"
      />

      <text
        x="35"
        y="43"
        text-anchor="middle"
        font-family="Arial"
        font-size="11"
        font-weight="700"
