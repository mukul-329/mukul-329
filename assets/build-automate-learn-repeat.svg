      <circle
        cx="35"
        cy="-20"
        r="8"
        fill="#1764E8"
      />

      <circle
        cx="70"
        cy="0"
        r="8"
        fill="#1764E8"
      />

      <circle
        cx="35"
        cy="25"
        r="8"
