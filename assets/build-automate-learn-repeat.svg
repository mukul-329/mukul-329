           C0 15 12 5 27 5
           C34 -10 58 -12 69 5
           C85 3 98 13 98 28
           Z"
        fill="#1764E8"
      />

      <text
        x="49"
        y="25"
        text-anchor="middle"
        font-family="Arial"
        font-size="10"
        font-weight="700"
        fill="white"
