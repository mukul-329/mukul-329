<svg
  width="100%"
  viewBox="0 0 1000 100"
  xmlns="http://www.w3.org/2000/svg"
>

  <!-- CENTERED CONTENT -->
  <g transform="translate(310, 0)">

    <!-- Waving Hand -->
    <text
      x="0"
      y="70"
      font-family="Arial, sans-serif"
      font-size="42"
    >
      👋
      <animateTransform
        attributeName="transform"
        type="rotate"
        values="-10 20 55; 10 20 55; -10 20 55"
        dur="1s"
        repeatCount="indefinite"
      />
    </text>

    <!-- Name -->
    <text
      x="58"
      y="70"
      font-family="Arial, Helvetica, sans-serif"
      font-size="42"
      font-weight="600"
      fill="#172235"
    >
      Hi, I'm Mukul Sengar
    </text>

  </g>

  <!-- UNDERLINE -->
  <line
    x1="0"
    y1="88"
    x2="1000"
    y2="88"
    stroke="#d8dee8"
    stroke-width="2"
  />

</svg>
